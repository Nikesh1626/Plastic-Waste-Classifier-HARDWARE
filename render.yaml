services:
  - type: web
    name: plastic-ai-project
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_DEBUG
        value: "false"
      - key: MODEL_PATH
        value: plastic-ai-project/model/plastic_model.h5
      - key: MAX_CONTENT_LENGTH_MB
        value: "8"
      - key: RECYCLER_RADIUS_METERS
        value: "50000"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_LIGHT_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: SORTBOT_ENABLED
        value: "false"
      - key: SORTBOT_SERIAL_PORT
        value: ""
      - key: SORTBOT_BAUD_RATE
        value: "9600"
      - key: SORTBOT_CONFIDENCE_THRESHOLD
        value: "50"
      - key: SORTBOT_SERIAL_TIMEOUT
        value: "1"
      - key: SORTBOT_OPERATION_TIMEOUT
        value: "180"
      - key: SORTBOT_BIN_1_COMMAND
        value: "T1"
      - key: SORTBOT_BIN_2_COMMAND
        value: "T2"
      - key: SORTBOT_BIN_3_COMMAND
        value: "T3"
      - key: SORTBOT_BIN_4_COMMAND
        value: "T4"
